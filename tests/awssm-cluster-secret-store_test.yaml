suite: awssm ClusterSecretStore settings per environment
capabilities:
  apiVersions:
  - external-secrets.io/v1/ClusterSecretStore
release:
  name: &releaseName external-secrets
  namespace: *releaseName
templates:
- templates/awssm-cluster-secret-store.yaml
tests:
- it: renders ClusterSecretStore metadata from template defaults on local
  values: &localValues
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - matchRegex:
      path: apiVersion
      pattern: ^external-secrets\.io/v1$
  - matchRegex:
      path: kind
      pattern: ^ClusterSecretStore$
  - matchRegex:
      path: metadata.name
      pattern: ^awssm-parameter-store$
  - matchRegex:
      path: metadata.annotations["argocd.argoproj.io/sync-wave"]
      pattern: ^100$
  - matchRegex:
      path: metadata.labels.exclude-from-first-install
      pattern: ^true$
- it: uses development aws role for local environment
  values: *localValues
  asserts: &developmentRoleAsserts
  - matchRegex:
      path: spec.provider.aws.role
      pattern: ^arn:aws:iam::737742117295:role/external-secrets$
- it: uses development aws role for development environment
  values: &devValues
  - ../values-subchart-overrides.yaml
  - ../values-development.yaml
  asserts: *developmentRoleAsserts
- it: uses production aws role override from values-production
  values: &prodValues
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - matchRegex:
      path: spec.provider.aws.role
      pattern: ^arn:aws:iam::065204381364:role/external-secrets$
- it: renders aws auth secret references
  asserts:
  - equal:
      path: spec.provider.aws.auth
      value:
        secretRef:
          accessKeyIDSecretRef:
            key: aws_access_key_id
            name: awssm-secret
            namespace: external-secrets
          secretAccessKeySecretRef:
            key: aws_secret_access_key
            name: awssm-secret
            namespace: external-secrets
- it: renders aws region
  asserts:
  - matchRegex:
      path: spec.provider.aws.region
      pattern: ^eu-central-1$
- it: renders aws service type
  asserts:
  - matchRegex:
      path: spec.provider.aws.service
      pattern: ^ParameterStore$
