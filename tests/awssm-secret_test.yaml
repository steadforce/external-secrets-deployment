suite: awssm Secret settings
release:
  name: external-secrets
set:
  aws.accessKeyId: &awsAccessId test-aws_access_key_id
  aws.secretAccessKey: &awsSecretAccessKey test-aws_secret_access_key
  bootstrapResources.enabled: true
templates:
- templates/awssm-secret.yaml
tests:
- it: matches the awssm-secret snapshot
  asserts:
  - matchSnapshot: {}
- it: sets aws_access_key_id from value key aws.accessKeyId
  asserts:
  - equal:
      decodeBase64: true
      path: data.aws_access_key_id
      value: *awsAccessId
- it: sets aws_secret_access_key from value key aws.secretAccessKey
  asserts:
  - equal:
      decodeBase64: true
      path: data.aws_secret_access_key
      value: *awsSecretAccessKey
- it: omits the secret when bootstrapResources.enabled is false
  set:
    aws.accessKeyId: ~
    aws.secretAccessKey: ~
    bootstrapResources.enabled: false
  asserts:
  - containsDocument:
      kind: Secret
      apiVersion: v1
      name: awssm-secret
    not: true
