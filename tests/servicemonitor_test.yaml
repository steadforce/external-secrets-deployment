suite: ServiceMonitor labels per environment
capabilities:
  apiVersions:
  - monitoring.coreos.com/v1
  - monitoring.coreos.com/v1/ServiceMonitor
release:
  name: external-secrets
templates:
- charts/external-secrets/templates/servicemonitor.yaml
tests:
- it: sets prometheus label on core controller monitor for local environment
  values: &localValues
  - &subchartOverrideValuesFile ../values-subchart-overrides.yaml
  - ../values-local.yaml
  documentSelector: &coreControllerMonitorSelector
    path: metadata.name
    value: external-secrets-metrics
  asserts: &prometheusLabelAssert
  - matchRegex:
      path: metadata.labels.prometheus
      pattern: ^cluster-monitoring$
- it: sets prometheus label on webhook monitor for local environment
  values: *localValues
  documentSelector: &webhookMonitorSelector
    path: metadata.name
    value: external-secrets-webhook-metrics
  asserts: *prometheusLabelAssert
- it: sets prometheus label on cert-controller monitor for local environment
  values: *localValues
  documentSelector: &certControllerMonitorSelector
    path: metadata.name
    value: external-secrets-cert-controller-metrics
  asserts: *prometheusLabelAssert
- it: sets prometheus label on core controller monitor for development environment
  values: &developmentValues
  - *subchartOverrideValuesFile
  - ../values-development.yaml
  documentSelector: *coreControllerMonitorSelector
  asserts: *prometheusLabelAssert
- it: sets prometheus label on webhook monitor for development environment
  values: *developmentValues
  documentSelector: *webhookMonitorSelector
  asserts: *prometheusLabelAssert
- it: sets prometheus label on cert-controller monitor for development environment
  values: *developmentValues
  documentSelector: *certControllerMonitorSelector
  asserts: *prometheusLabelAssert
- it: sets prometheus label on core controller monitor for production environment
  values: &productionValues
  - *subchartOverrideValuesFile
  - ../values-production.yaml
  documentSelector: *coreControllerMonitorSelector
  asserts: *prometheusLabelAssert
- it: sets prometheus label on webhook monitor for production environment
  values: *productionValues
  documentSelector: *webhookMonitorSelector
  asserts: *prometheusLabelAssert
- it: sets prometheus label on cert-controller monitor for production environment
  values: *productionValues
  documentSelector: *certControllerMonitorSelector
  asserts: *prometheusLabelAssert
