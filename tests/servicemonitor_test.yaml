suite: serviceMonitor labels per environment
capabilities:
  apiVersions:
  - monitoring.coreos.com/v1
release:
  name: external-secrets
templates:
- charts/external-secrets/templates/servicemonitor.yaml
tests:
- it: sets prometheus label on core controller monitor for local
  values: &localValues
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  documentSelector:
    path: metadata.name
    value: external-secrets-metrics
  asserts: &prometheusLabelAssert
  - matchRegex:
      path: metadata.labels.prometheus
      pattern: ^cluster-monitoring$
- it: sets prometheus label on webhook monitor for local
  values: *localValues
  documentSelector:
    path: metadata.name
    value: external-secrets-webhook-metrics
  asserts: *prometheusLabelAssert
- it: sets prometheus label on cert-controller monitor for local
  values: *localValues
  documentSelector:
    path: metadata.name
    value: external-secrets-cert-controller-metrics
  asserts: *prometheusLabelAssert
- it: sets prometheus label on core controller monitor for development
  values: &devValues
  - ../values-subchart-overrides.yaml
  - ../values-development.yaml
  documentSelector:
    path: metadata.name
    value: external-secrets-metrics
  asserts: *prometheusLabelAssert
- it: sets prometheus label on webhook monitor for development
  values: *devValues
  documentSelector:
    path: metadata.name
    value: external-secrets-webhook-metrics
  asserts: *prometheusLabelAssert
- it: sets prometheus label on cert-controller monitor for development
  values: *devValues
  documentSelector:
    path: metadata.name
    value: external-secrets-cert-controller-metrics
  asserts: *prometheusLabelAssert
- it: sets prometheus label on core controller monitor for production
  values: &prodValues
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  documentSelector:
    path: metadata.name
    value: external-secrets-metrics
  asserts: *prometheusLabelAssert
- it: sets prometheus label on webhook monitor for production
  values: *prodValues
  documentSelector:
    path: metadata.name
    value: external-secrets-webhook-metrics
  asserts: *prometheusLabelAssert
- it: sets prometheus label on cert-controller monitor for production
  values: *prodValues
  documentSelector:
    path: metadata.name
    value: external-secrets-cert-controller-metrics
  asserts: *prometheusLabelAssert
